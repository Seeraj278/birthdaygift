<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Distance — Final Quest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090610}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw,177.68vh);height:min(100vh,56.28vw);overflow:hidden;user-select:none}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#atmosphere{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(circle at 50% 45%,rgba(202,98,255,.10),transparent 30%),
radial-gradient(circle at 82% 15%,rgba(255,129,199,.08),transparent 18%);
mix-blend-mode:screen;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#f7ddff;
box-shadow:0 0 7px #e7b7ff;z-index:4;pointer-events:none;
animation:twinkle var(--d) ease-in-out var(--delay) infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.35)}}

#bossHit{position:absolute;left:31%;top:8%;width:49%;height:76%;z-index:12;border:0;background:transparent;cursor:crosshair;outline:none}
#bossHit:hover{filter:none}
#bossHit.hurt{animation:shake .30s steps(2,end)}
@keyframes shake{
0%{transform:translate(0,0)}20%{transform:translate(-9px,3px)}40%{transform:translate(8px,-3px)}60%{transform:translate(-6px,-2px)}80%{transform:translate(5px,2px)}100%{transform:translate(0,0)}
}

#damageFlash{position:absolute;left:31%;top:8%;width:49%;height:76%;z-index:11;pointer-events:none;opacity:0;
background:radial-gradient(ellipse at center,rgba(255,255,255,.36),rgba(255,80,120,.17) 40%,transparent 70%);
mix-blend-mode:screen}
#damageFlash.on{animation:flash .28s ease-out}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

.slash{position:absolute;width:145px;height:8px;border-radius:50%;z-index:20;pointer-events:none;
background:linear-gradient(90deg,transparent,#fff6dc 28%,#ffd269 55%,transparent);
box-shadow:0 0 11px #fff1ae;transform-origin:center;animation:slash .36s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scaleX(.15)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1.35)}}

.damage{position:absolute;z-index:22;color:#ffe4a0;font:bold 28px Georgia,serif;text-shadow:2px 2px #3a102c,0 0 8px #ffcb61;pointer-events:none;
animation:floatDamage .8s ease-out forwards}
@keyframes floatDamage{from{transform:translate(-50%,-50%) scale(.7);opacity:0}20%{opacity:1}to{transform:translate(-50%,-115%) scale(1.1);opacity:0}}

#barWrap{position:absolute;left:50%;top:4%;transform:translateX(-50%);width:52%;height:23px;padding:3px;
background:rgba(18,10,25,.82);border:2px solid #c18a55;z-index:25;box-shadow:0 0 12px rgba(0,0,0,.6)}
#bar{height:100%;width:100%;background:linear-gradient(90deg,#7f173b,#d74265,#e46c83);transition:width .25s ease}
#name{position:absolute;top:7.4%;left:50%;transform:translateX(-50%);z-index:25;color:#f4d9df;font:700 clamp(13px,1.35vw,22px) Georgia,serif;letter-spacing:2px;text-shadow:2px 2px #160c18;white-space:nowrap}

#hint{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%);z-index:25;color:rgba(255,239,218,.72);
font:clamp(12px,1.15vw,18px) Georgia,serif;background:rgba(16,9,19,.52);padding:7px 14px;border:1px solid rgba(211,158,192,.32);transition:opacity .4s}
#rewardScreen{position:absolute;inset:0;z-index:40;display:none;place-items:center;padding:18px;background:rgba(8,4,14,.68)}
#rewardScreen.show{display:grid}
.reward-card{width:min(620px,94vw);max-height:90vh;overflow:auto;padding:clamp(22px,4vw,42px);text-align:center;background:rgba(29,23,39,.96);border:3px solid #efb64f;box-shadow:8px 8px 0 rgba(26,14,20,.82);color:#fff0c9}
.reward-card h1{font:clamp(14px,2vw,23px)/1.6 'Press Start 2P',monospace;margin:0 0 22px;text-shadow:3px 3px #4c2b3a}
.reward-card p{font:clamp(23px,3vw,32px) 'VT323',monospace;margin:0 0 18px}
#rewardGift{display:block;margin:0 auto;padding:12px 22px;border:3px solid #efb64f;background:#241a2b;color:#fff0c9;box-shadow:5px 5px 0 #120c18;cursor:pointer;font:clamp(11px,1.5vw,16px) 'Press Start 2P',monospace}
#rewardGift:hover,#rewardGift:focus-visible{background:#503149;transform:translateY(-2px)}
#rewardIcon{display:block;width:clamp(90px,15vw,145px);height:clamp(90px,15vw,145px);object-fit:contain;margin:0 auto 10px;filter:drop-shadow(0 0 12px rgba(239,182,79,.4));image-rendering:pixelated}
#letterScreen{position:absolute;inset:0;z-index:41;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(8,4,14,.92)}
#letterScreen.show{display:flex}
#letterImage{display:block;max-width:min(94vw,1100px);max-height:94vh;width:auto;height:auto;object-fit:contain;image-rendering:auto}
#letterClose{position:absolute;top:clamp(12px,3vw,30px);right:clamp(12px,3vw,30px);z-index:2;border:3px solid #efb64f;background:#241a2b;color:#fff0c9;padding:7px 13px;font:24px 'Press Start 2P',monospace;cursor:pointer}
#letterClose:hover,#letterClose:focus-visible{background:#503149}
</style>
</head>

<div id="damageFlash"></div>
<button id="bossHit" aria-label="Attack The Distance"></button>
<div id="barWrap"><div id="bar"></div></div>
<div id="name">THE DISTANCE</div>
<div id="hint">Click the boss to attack</div>
<div id="rewardScreen" role="dialog" aria-modal="true" aria-labelledby="rewardTitle"><div class="reward-card"><h1 id="rewardTitle">Congratulations for defeating the boss!</h1><p id="rewardPrompt">Click to open your reward</p><button id="rewardGift" type="button" aria-label="Open your reward"><img id="rewardIcon" src="assets/boss-reward.png" alt="">OPEN REWARD</button></div></div>
<div id="letterScreen" role="dialog" aria-modal="true" aria-label="Your birthday letter"><button id="letterClose" type="button" aria-label="Close letter">×</button><img id="letterImage" src="assets/boss-letter.png" alt="A birthday letter from Seeraj"></div>
</div>

<script>
const game=document.getElementById('game');
const boss=document.getElementById('bossHit');
const bar=document.getElementById('bar');
const flash=document.getElementById('damageFlash');
const hint=document.getElementById('hint');
const rewardScreen=document.getElementById('rewardScreen');
const letterScreen=document.getElementById('letterScreen');
const letterOpenSound=new Audio('assets/letter-open-sound.mp3');
letterOpenSound.preload='auto';
letterOpenSound.volume=0.8;
document.getElementById('rewardGift').addEventListener('click',()=>{
 rewardScreen.classList.remove('show');
 letterScreen.classList.add('show');
 letterOpenSound.currentTime=0;
 const letterPlayback=letterOpenSound.play();
 if(letterPlayback?.catch)letterPlayback.catch(()=>{});
 document.getElementById('letterClose').focus();
});
document.getElementById('letterClose').addEventListener('click',()=>{
 letterScreen.classList.remove('show');
 rewardScreen.classList.add('show');
 document.getElementById('rewardGift').focus();
});
const hitSounds=Array.from({length:4},()=>{
 const sound=new Audio('assets/boss-hit.mp3');
 sound.preload='auto';
 sound.volume=0.7;
 return sound;
});
let nextHitSound=0;

let hp=100;
let defeated=false;

function attack(e){
 if(defeated) return;
 const hitSound=hitSounds[nextHitSound++%hitSounds.length];
 hitSound.currentTime=0;
 const hitPlayback=hitSound.play();
 if(hitPlayback?.catch)hitPlayback.catch(()=>{});
 const gr=game.getBoundingClientRect();
 const x=e.clientX-gr.left, y=e.clientY-gr.top;

 // A small randomized hit makes the fight feel responsive without being grindy.
 const dmg=7+Math.floor(Math.random()*7);
 hp=Math.max(0,hp-dmg);
 bar.style.width=hp+'%';
 hint.style.opacity='0';

 boss.classList.remove('hurt'); void boss.offsetWidth; boss.classList.add('hurt');
 flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');

 const slash=document.createElement('span');
 slash.className='slash';
 slash.style.left=x+'px'; slash.style.top=y+'px';
 slash.style.setProperty('--r',(-38+Math.random()*76)+'deg');
 game.appendChild(slash);
 setTimeout(()=>slash.remove(),400);

 const n=document.createElement('span');
 n.className='damage'; n.textContent='-'+dmg;
 n.style.left=x+'px'; n.style.top=y+'px';
 game.appendChild(n); setTimeout(()=>n.remove(),850);

 if(hp<=0){
   defeated=true;
   window.parent.postMessage({type:'boss-defeated'},'*');
   bar.style.width='0%';
   boss.style.cursor='default';
   setTimeout(()=>{
     document.getElementById('name').textContent='THE DISTANCE — DEFEATED';
     rewardScreen.classList.add('show');
     document.getElementById('rewardGift').focus();
   },650);
 }
}

boss.addEventListener('click',attack);
</script>
